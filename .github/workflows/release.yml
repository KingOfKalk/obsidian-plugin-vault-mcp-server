name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      # Installation token of the private GitHub App kingofkalk-release-bot (secrets
      # RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY). Events created with GITHUB_TOKEN start
      # no workflows; with the App token the release PR triggers CI, so the required checks report.
      # contents: commits, release branch, tag and release; pull-requests: the release PR and its
      # `autorelease: *` labels (both labels exist, so no issues permission).
      # The build and `gh release upload` below keep GITHUB_TOKEN.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - name: Use Node.js 24.22.1
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Create styles.css placeholder
        if: ${{ steps.release.outputs.release_created }}
        run: echo "/* vault-mcp-server styles */" > styles.css

      - name: Build plugin zip
        if: ${{ steps.release.outputs.release_created }}
        env:
          PLUGIN_ID: vault-mcp-server
          VERSION: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
        run: |
          mkdir -p "dist/${PLUGIN_ID}"
          cp main.js manifest.json styles.css "dist/${PLUGIN_ID}/"
          (cd dist && zip -r "../${PLUGIN_ID}-${VERSION}.zip" "${PLUGIN_ID}")

      - name: Upload plugin release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} \
            main.js \
            manifest.json \
            styles.css \
            versions.json \
            "vault-mcp-server-${VERSION}.zip"

  # Adds the release PR's version to versions.json on the release branch, so
  # the entry is part of the release commit and the release uploads the
  # committed file (#421). release-please rewrites the branch whenever the PR
  # changes and reports it in `prs_created`, so this runs after every PR
  # update and is a no-op when the entry is already there. It pushes with the
  # App token (contents: write) as the App's bot user, so the push triggers CI
  # on the release PR and the required checks report on its head commit.
  versions-json:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Get the App's bot user ID
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        # Assignment first, so a failing `gh api` fails the step (bash -e).
        run: |
          id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Add version to versions.json
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
        run: |
          node -e '
            const fs = require("fs");
            const { version, minAppVersion } = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            versions[version] = minAppVersion;
            fs.writeFileSync("versions.json", JSON.stringify(versions, null, "\t") + "\n");
          '
          if git diff --quiet -- versions.json; then
            echo "versions.json is up to date"
            exit 0
          fi
          VERSION=$(node -p 'require("./manifest.json").version')
          echo "Adding ${VERSION} to versions.json"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "chore: add ${VERSION} to versions.json" -- versions.json
          git push
