name: Release

on:
  push:
    branches: [main]

# Default for every job; jobs that write ask for it explicitly.
permissions:
  contents: read

# One run at a time: two quick merges otherwise race on the release PR branch, and the
# versions-json push of the older run is rejected. Queued runs are not cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Jobs: release-please -> (release created) build -> publish; (release PR changed) versions-json.
# `npm ci` and the build run in `build`, which holds a read-only token. Only release-please,
# versions-json and publish can write, and none of them install dependencies.
#
# release-please and versions-json write with a short-lived installation token of the private
# GitHub App kingofkalk-release-bot (secrets RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY),
# limited per job with `permission-*`. Events created with GITHUB_TOKEN start no workflows; with
# the App token the release PR and the versions.json commit trigger CI, so the required status
# checks report on the release PR. Both jobs give their GITHUB_TOKEN no permissions.
jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      # contents: commits, release branch, tag and release; pull-requests: the release PR and its
      # `autorelease: *` labels (both labels exist, so no issues permission).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Builds the release assets with a read-only token and hands them to `publish` as an artifact.
  # persist-credentials: false keeps the token out of .git/config, out of reach of install scripts.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node.js and `npm ci` as in CI.
      - uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      # styles.css is tracked and shipped as is; never overwrite it (#553).
      - name: Verify styles.css exists
        run: test -s styles.css

      - name: Build plugin zip
        env:
          PLUGIN_ID: vault-mcp-server
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir -p "dist/${PLUGIN_ID}"
          cp main.js manifest.json styles.css "dist/${PLUGIN_ID}/"
          (cd dist && zip -r "../${PLUGIN_ID}-${VERSION}.zip" "${PLUGIN_ID}")

      - name: Upload release assets artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            main.js
            manifest.json
            styles.css
            versions.json
            vault-mcp-server-${{ needs.release-please.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

  # The only job that writes release assets: no checkout, no npm. --clobber lets a re-run replace
  # assets a failed attempt already uploaded.
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release assets artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Upload plugin release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        working-directory: release-assets
        run: |
          gh release upload "$TAG" --repo "$REPO" --clobber \
            main.js \
            manifest.json \
            styles.css \
            versions.json \
            "vault-mcp-server-${VERSION}.zip"

  # Adds the release PR's version to versions.json on the release branch, so
  # the entry is part of the release commit and the release uploads the
  # committed file (#421). release-please rewrites the branch whenever the PR
  # changes and reports it in `prs_created`, so this runs after every PR
  # update and is a no-op when the entry is already there. It pushes with the
  # App token (contents: write) as the App's bot user, so the push triggers CI
  # on the release PR and the required checks report on its head commit. It
  # installs nothing.
  versions-json:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Get the App's bot user ID
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        # Assignment first, so a failing `gh api` fails the step (bash -e).
        run: |
          id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Add version to versions.json
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
        run: |
          node -e '
            const fs = require("fs");
            const { version, minAppVersion } = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            versions[version] = minAppVersion;
            fs.writeFileSync("versions.json", JSON.stringify(versions, null, "\t") + "\n");
          '
          if git diff --quiet -- versions.json; then
            echo "versions.json is up to date"
            exit 0
          fi
          VERSION=$(node -p 'require("./manifest.json").version')
          echo "Adding ${VERSION} to versions.json"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "chore: add ${VERSION} to versions.json" -- versions.json
          git push
