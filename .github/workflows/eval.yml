name: LLM eval

# Manual only: the eval calls the Claude API and costs money. It never runs
# on pushes or pull requests and is not a required check. See evals/README.md.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Claude model (empty = runner default)'
        required: false
        default: ''
      only:
        description: 'Question numbers to run, e.g. 1,4 (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: ${{ inputs.model }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=(--report eval-report.json)
          if [ -n "${ONLY}" ]; then args+=(--only "${ONLY}"); fi
          npm run eval -- "${args[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore
