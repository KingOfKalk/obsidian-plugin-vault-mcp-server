name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job summaries and annotations come from scripts/ci-summary.ts (#416).
jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # The three checks continue on error so all of them are reported; the
      # last step fails the job if any of them failed.
      - name: Lint
        id: eslint
        continue-on-error: true
        run: |
          status=0
          npm run --silent lint -- --format json --output-file "$RUNNER_TEMP/eslint.json" || status=$?
          npx tsx scripts/ci-summary.ts annotate eslint "$RUNNER_TEMP/eslint.json"
          exit "$status"

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: |
          status=0
          npm run --silent typecheck -- --pretty false > "$RUNNER_TEMP/tsc.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/tsc.txt"
          npx tsx scripts/ci-summary.ts annotate tsc "$RUNNER_TEMP/tsc.txt"
          exit "$status"

      - name: Check tool registry snapshot is up to date
        id: docs
        continue-on-error: true
        run: npm run --silent docs:check 2>&1 | tee "$RUNNER_TEMP/docs-check.txt"

      - name: Summary
        run: >-
          npx tsx scripts/ci-summary.ts lint
          --eslint "$RUNNER_TEMP/eslint.json" --eslint-outcome "${{ steps.eslint.outcome }}"
          --tsc "$RUNNER_TEMP/tsc.txt" --tsc-outcome "${{ steps.typecheck.outcome }}"
          --docs "$RUNNER_TEMP/docs-check.txt" --docs-outcome "${{ steps.docs.outcome }}"

      - name: Fail if any check failed
        if: steps.eslint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.docs.outcome != 'success'
        run: |
          echo "::error::ESLint: ${{ steps.eslint.outcome }}, Typecheck: ${{ steps.typecheck.outcome }}, docs:check: ${{ steps.docs.outcome }}. See the job summary."
          exit 1

  test:
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        id: setup

      - name: Test
        run: npm run test:coverage

      # Also runs when the coverage thresholds fail the previous step.
      - name: Coverage summary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npx tsx scripts/ci-summary.ts coverage coverage/coverage-summary.json

      # The budget itself is checked by the Test step
      # (tests/scripts/surface/surface-budget.test.ts). This step only shows
      # the numbers and the difference against main's baseline (#450). A
      # missing baseline on main (before #450 landed) is not an error.
      - name: Agent-facing surface summary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if git fetch --quiet --depth=1 origin main \
            && git show FETCH_HEAD:docs/surface-baseline.json > "$RUNNER_TEMP/surface-main.json" 2>/dev/null; then
            echo "Comparing with docs/surface-baseline.json on main."
          else
            echo "No docs/surface-baseline.json on main; no comparison."
            rm -f "$RUNNER_TEMP/surface-main.json"
          fi
          npx tsx scripts/measure-surface.ts --json "$RUNNER_TEMP/surface.json"
          npx tsx scripts/ci-summary.ts surface --current "$RUNNER_TEMP/surface.json" \
            --baseline docs/surface-baseline.json --main "$RUNNER_TEMP/surface-main.json"

  # Headless Obsidian E2E (#441). Runs in parallel with `test` once lint
  # (which also type-checks e2e/) passes: it needs neither the unit tests
  # nor the build job (`npm run test:e2e` builds itself), and keeping it out
  # of the test -> build chain means the slow job does not delay the build
  # artifact. Not a required check yet; the owner decides after a few runs.
  e2e:
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The wdio.conf.mts default: oldest public release >= minAppVersion.
          - name: minimum
            obsidian: ''
          # A pinned current release, so APIs added after the minimum (e.g.
          # fileManager.trashFile, 1.6.6) are covered too. Bump it by hand.
          - name: current
            obsidian: 1.15.0
    name: e2e (${{ matrix.name }})
    env:
      OBSIDIAN_VERSION: ${{ matrix.obsidian }}
      OBSIDIAN_INSTALLER: ${{ matrix.obsidian }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: 22.23.4

      - name: Install Xvfb and Electron libraries
        run: bash scripts/install-e2e-deps.sh

      # Key the Obsidian download cache by the app and installer versions
      # wdio.conf.mts resolves (empty env vars mean its defaults).
      - name: Obsidian version
        id: obsidian
        run: |
          node --input-type=module -e '
            const { config } = await import("./wdio.conf.mts");
            const cap = config.capabilities[0];
            const installer = cap["wdio:obsidianOptions"].installerVersion;
            console.log("version=" + cap.browserVersion + "-" + installer);
          ' >> "$GITHUB_OUTPUT"

      - name: Cache Obsidian
        uses: actions/cache@v6
        with:
          path: .obsidian-cache
          key: obsidian-${{ runner.os }}-${{ runner.arch }}-${{ steps.obsidian.outputs.version }}

      - name: E2E tests
        run: npm run test:e2e

  build:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # actions: read lets `gh run download` fetch the bundle size baseline.
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLUGIN_ARTIFACT_RETENTION_DAYS: 14
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      - name: Verify main.js exists
        run: test -f main.js

      - name: Create styles.css placeholder
        run: echo "/* vault-mcp-server styles */" > styles.css

      - name: Measure bundle size
        id: size
        run: |
          npx tsx scripts/ci-summary.ts size main.js --sha "$HEAD_SHA" --out "$RUNNER_TEMP/bundle-size.json"
          echo "artifact-name=vault-mcp-server-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle size baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size
          path: ${{ runner.temp }}/bundle-size.json
          if-no-files-found: error
          retention-days: 90

      # A missing baseline (first run, expired artifact) is not an error: the
      # summary then says "no baseline".
      - name: Download bundle size baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No successful CI run on main found; no baseline."
            exit 0
          fi
          gh run download "$run_id" --repo "$REPO" --name bundle-size --dir "$RUNNER_TEMP/baseline" \
            || echo "Run $run_id has no bundle-size artifact; no baseline."

      - name: Upload plugin artifact
        id: plugin
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.size.outputs.artifact-name }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: ${{ env.PLUGIN_ARTIFACT_RETENTION_DAYS }}

      - name: Summary
        if: ${{ !cancelled() && steps.size.outcome == 'success' }}
        env:
          ARTIFACT_NAME: ${{ steps.plugin.outcome == 'success' && steps.size.outputs.artifact-name || '' }}
          ARTIFACT_URL: ${{ steps.plugin.outputs.artifact-url }}
        run: >-
          npx tsx scripts/ci-summary.ts build
          --size "$RUNNER_TEMP/bundle-size.json"
          --baseline "$RUNNER_TEMP/baseline/bundle-size.json"
          --manifest manifest.json
          --event "$GITHUB_EVENT_NAME"
          --artifact-name "$ARTIFACT_NAME"
          --artifact-url "$ARTIFACT_URL"
          --retention-days "$PLUGIN_ARTIFACT_RETENTION_DAYS"
