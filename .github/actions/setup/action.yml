name: Setup
description: Set up Node.js with npm cache and install dependencies

runs:
  using: composite
  steps:
    - name: Use Node.js 22.12.0
      uses: actions/setup-node@v7
      with:
        node-version: 22.12.0
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
